<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پیگیری درخواست وقت | Donya Nail Art</title><meta name="theme-color" content="#17110f"><link rel="manifest" href="/manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#17110f;--paper:#f8f3ed;--wine:#731724;--muted:#756b63;--line:rgba(23,17,15,.13)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(150deg,#f8f3ed,#eadfd6);font-family:Vazirmatn,system-ui;color:var(--ink);padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 70px rgba(35,18,15,.1)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}.brand img{width:48px;height:48px;border-radius:14px}.brand b,h1{font-family:Estedad}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.btn{width:100%;border:0;border-radius:14px;padding:13px;font:700 16px Vazirmatn;margin-top:14px;cursor:pointer}.danger{background:#8c2733;color:#fff}.home{background:#eee4db;color:var(--ink)}.notify{background:var(--wine);color:#fff}.error{padding:15px;border-radius:14px;background:#f6e4e6;color:#7b2732}.ok{padding:14px;border-radius:14px;background:#e6f1e7;color:#25582c;margin-top:12px}.pending{padding:12px 14px;border-radius:14px;background:#fff4d6;color:#6a4c08;margin:12px 0}.status-confirmed{color:#235f32}.status-cancelled{color:#872b36}.status-pending{color:#805b12}</style></head><body><main class="card"><div class="brand"><img src="/assets/logo.webp" alt="Donya Nail Art"><div><b>Donya Nail Art</b><div class="muted">پیگیری درخواست وقت شما</div></div></div><div id="content"><p class="muted">در حال دریافت اطلاعات…</p></div><a href="/" style="text-decoration:none"><button class="btn home">بازگشت به سایت</button></a></main><script>const qs=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=new URL(location.href),id=url.searchParams.get('id')||location.pathname.split('/').filter(Boolean).pop(),token=url.searchParams.get('token');let bookingData=null,timezone='UTC';const fdate=d=>new Intl.DateTimeFormat('fa-IR',{timeZone:timezone,weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);const b64Key=value=>{const s=String(value||'').replace(/-/g,'+').replace(/_/g,'/'),raw=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))};async function load(){if(!id||!token){showError('لینک پیگیری درخواست کامل نیست.');return}try{const r=await fetch(`/api/2nya-nailart/manage?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'درخواست پیدا نشد.');bookingData=j.booking;timezone=j.timezone||'UTC';const b=j.booking;qs('#content').innerHTML=`<h1>درخواست ${esc(b.booking_reference)}</h1>${b.status==='pending'?'<div class="pending">درخواست شما ثبت شده و منتظر تأیید دنیا است.</div>':''}<div class="row"><span>سرویس</span><b>${esc(b.service_name)}</b></div><div class="row"><span>زمان</span><b>${fdate(new Date(b.start_at))}</b></div><div class="row"><span>نام</span><b>${esc(b.customer_name)}</b></div><div class="row"><span>وضعیت</span><b class="status-${esc(b.status)}">${statusFa(b.status)}</b></div>${b.status==='pending'?'<button id="notify" class="btn notify">اعلان نتیجه درخواست روی موبایل</button><div id="notifyMsg" class="muted"></div>':''}${['pending','confirmed'].includes(b.status)?'<button id="cancel" class="btn danger">لغو این وقت</button>':''}`;if(qs('#cancel'))qs('#cancel').onclick=cancel;if(qs('#notify'))qs('#notify').onclick=enablePush}catch(e){showError(e.message)}}async function enablePush(){const btn=qs('#notify'),msg=qs('#notifyMsg');try{btn.disabled=true;if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('اعلان روی این مرورگر پشتیبانی نمی‌شود.');const p=await Notification.requestPermission();if(p!=='granted')throw Error('اجازه اعلان داده نشد.');const kr=await fetch('/api/2nya-nailart/push-key',{cache:'no-store'}),kj=await kr.json();if(!kr.ok||!kj.public_key)throw Error('سرویس اعلان در دسترس نیست.');const reg=await navigator.serviceWorker.ready,old=await reg.pushManager.getSubscription(),newKey=b64Key(kj.public_key);if(old){const a=old.options?.applicationServerKey?Array.from(new Uint8Array(old.options.applicationServerKey)).join(','):'',b=Array.from(newKey).join(',');if(a&&a!==b)await old.unsubscribe()}const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:newKey});const r=await fetch('/api/2nya-nailart/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'push_subscribe',id,token,subscription:sub.toJSON()})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'فعال‌سازی اعلان انجام نشد.');msg.textContent='اعلان فعال شد. نتیجه تأیید یا رد درخواست روی این دستگاه ارسال می‌شود.';btn.remove()}catch(e){msg.textContent=e.message;btn.disabled=false}}async function cancel(){if(!confirm('این وقت لغو شود؟'))return;const b=qs('#cancel');b.disabled=true;const r=await fetch('/api/2nya-nailart/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',id,token})}),j=await r.json();if(!r.ok||!j.ok){alert(j.error||'لغو انجام نشد');b.disabled=false;return}await load()}function showError(m){qs('#content').innerHTML=`<div class="error">${esc(m)}</div>`}function statusFa(s){return ({pending:'در انتظار تأیید',confirmed:'تأیید شده',completed:'انجام شده',cancelled:'لغو / رد شده',no_show:'عدم حضور'})[s]||s}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();</script></body></html>
