<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مدیریت رزرو | 2nya Nail Art</title><meta name="theme-color" content="#17110f"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#17110f;--paper:#f8f3ed;--wine:#731724;--muted:#756b63;--line:rgba(23,17,15,.13)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(150deg,#f8f3ed,#eadfd6);font-family:Vazirmatn,system-ui;color:var(--ink);padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 70px rgba(35,18,15,.1)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}.brand img{width:48px;height:48px;border-radius:14px}.brand b,h1{font-family:Estedad}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.btn{width:100%;border:0;border-radius:14px;padding:13px;font:700 16px Vazirmatn;margin-top:14px;cursor:pointer}.danger{background:#8c2733;color:#fff}.home{background:#eee4db;color:var(--ink)}.error{padding:15px;border-radius:14px;background:#f6e4e6;color:#7b2732}.ok{padding:14px;border-radius:14px;background:#e6f1e7;color:#25582c;margin-top:12px}</style></head><body><main class="card"><div class="brand"><img src="/assets/logo.webp" alt="2nya Nail Art"><div><b>2nya Nail Art</b><div class="muted">مدیریت رزرو شما</div></div></div><div id="content"><p class="muted">در حال دریافت اطلاعات رزرو…</p></div><a href="/" style="text-decoration:none"><button class="btn home">بازگشت به سایت</button></a></main><script>const qs=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=new URL(location.href),id=url.searchParams.get('id')||location.pathname.split('/').filter(Boolean).pop(),token=url.searchParams.get('token');const fdate=d=>new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);async function load(){if(!id||!token){showError('لینک مدیریت رزرو کامل نیست.');return}try{const r=await fetch(`/api/2nya-nailart/manage?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'رزرو پیدا نشد.');const b=j.booking;qs('#content').innerHTML=`<h1>رزرو ${esc(b.booking_reference)}</h1><div class="row"><span>سرویس</span><b>${esc(b.service_name)}</b></div><div class="row"><span>زمان</span><b>${fdate(new Date(b.start_at))}</b></div><div class="row"><span>نام</span><b>${esc(b.customer_name)}</b></div><div class="row"><span>وضعیت</span><b>${statusFa(b.status)}</b></div>${['pending','confirmed'].includes(b.status)?'<button id="cancel" class="btn danger">لغو این رزرو</button>':''}`;if(qs('#cancel'))qs('#cancel').onclick=cancel}catch(e){showError(e.message)}}async function cancel(){if(!confirm('رزرو لغو شود؟'))return;const b=qs('#cancel');b.disabled=true;const r=await fetch('/api/2nya-nailart/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',id,token})}),j=await r.json();if(!r.ok||!j.ok){alert(j.error||'لغو انجام نشد');b.disabled=false;return}qs('#content').insertAdjacentHTML('beforeend','<div class="ok">رزرو با موفقیت لغو شد.</div>');b.remove()}function showError(m){qs('#content').innerHTML=`<div class="error">${esc(m)}</div>`}function statusFa(s){return ({pending:'در انتظار',confirmed:'تأیید شده',completed:'انجام شده',cancelled:'لغو شده',no_show:'عدم حضور'})[s]||s}load();</script></body></html>
