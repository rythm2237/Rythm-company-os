name: W01 Ephemeral Database Replay (zero credentials)

on:
  pull_request:
    paths:
      - ".github/workflows/w01-local-db.yml"
      - "scripts/qa/prepare-w01-local-migrations.mjs"
      - "scripts/qa/recovered-migrations/**"
      - "scripts/qa/w01-local-db-attest.sql"
      - "scripts/qa/w01-tenant-matrix.sql"
      - "scripts/qa/w01-revoke-client-truncate.sql"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w01-isolated-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-schema-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_DB_PASSWORD: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      W01_ALLOW_LOCAL_TEST: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # pinned v3
        with:
          version: 2.84.2
      - name: CLI help and offline invariant tests
        run: |
          set -euo pipefail
          supabase --version
          supabase --help >/dev/null
          supabase db --help >/dev/null
          supabase db start --help >/dev/null
          supabase init --help >/dev/null
          node --check scripts/qa/prepare-w01-local-migrations.mjs
          node scripts/qa/prepare-w01-local-migrations.mjs --self-test
      - name: Prepare isolated local-only workspace
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          local_root="$(mktemp -d "$RUNNER_TEMP/w01-isolated.XXXXXX")"
          echo "W01_TEST_ROOT=$local_root" >> "$GITHUB_ENV"
          cd "$local_root"
          supabase init --yes
          cd "$GITHUB_WORKSPACE"
          node scripts/qa/prepare-w01-local-migrations.mjs "$local_root"
          test -f "$local_root/w01-local-migration-map.json"
          test ! -e "$local_root/supabase/migrations/202608050002_seed_company.sql"
      - name: Start disposable PostgreSQL and replay SQL migrations
        run: |
          set -euo pipefail
          cd "$W01_TEST_ROOT"
          # Local Docker only. No supabase link, db push, or linked reset.
          supabase db start
      - name: Physical schema and RLS attestation on local Docker only
        run: |
          set -euo pipefail
          test -n "$W01_TEST_ROOT"
          test -z "$SUPABASE_ACCESS_TOKEN"
          # Local development password only; never a Supabase cloud credential.
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f "$GITHUB_WORKSPACE/scripts/qa/w01-local-db-attest.sql"
      - name: Disconnect replay database and run complete tenant matrix
        run: |
          set -euo pipefail
          test_container="$(docker ps --format '{{.Names}}' --filter name=supabase_db_)"
          case "$test_container" in
            supabase_db_w01-isolated.*) ;;
            *) echo "Unexpected disposable database container"; exit 1 ;;
          esac
          test "$(printf '%s\n' "$test_container" | wc -l)" -eq 1
          docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$test_container" |
            while IFS= read -r test_network; do
              if [ -n "$test_network" ]; then docker network disconnect "$test_network" "$test_container"; fi
            done
          test "$(docker inspect --format '{{len .NetworkSettings.Networks}}' "$test_container")" = 0
          docker exec -i "$test_container" sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -w "$@"' w01-replay-admin -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1 --single-transaction -c "SET LOCAL w01.allow_client_truncate_hardening='isolated-only';" -f - < "$GITHUB_WORKSPACE/scripts/qa/w01-revoke-client-truncate.sql"
          docker exec -i "$test_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/scripts/qa/w01-tenant-matrix.sql"
          docker exec -i "$test_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $cleanup$ BEGIN
            IF EXISTS(SELECT 1 FROM public.organizations) OR EXISTS(SELECT 1 FROM auth.users)
              OR EXISTS(SELECT 1 FROM auth.sessions) OR EXISTS(SELECT 1 FROM cron.job)
              OR EXISTS(SELECT 1 FROM vault.secrets) OR to_regnamespace('w01_test') IS NOT NULL
              OR EXISTS(SELECT 1 FROM net.http_request_queue)
            THEN RAISE EXCEPTION 'Replay matrix fixture cleanup failed'; END IF;
          END $cleanup$;
          SQL
      - name: Preserve migration source mapping
        if: always()
        run: |
          set -eu
          if [ -n "$W01_TEST_ROOT" ] && [ -f "$W01_TEST_ROOT/w01-local-migration-map.json" ]; then
            cp "$W01_TEST_ROOT/w01-local-migration-map.json" "$GITHUB_WORKSPACE/w01-local-migration-map.json"
            sha256sum "$GITHUB_WORKSPACE/w01-local-migration-map.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: w01-disposable-migration-source-map
          path: w01-local-migration-map.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Dispose of local Supabase containers
        if: always()
        run: |
          set +e
          if [ -n "$W01_TEST_ROOT" ] && [ -d "$W01_TEST_ROOT" ]; then
            cd "$W01_TEST_ROOT"
            supabase stop --no-backup
            rm -rf -- "$W01_TEST_ROOT"
          fi
