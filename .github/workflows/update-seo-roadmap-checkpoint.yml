name: Update SEO roadmap checkpoint

on:
  push:
    branches: [docs/seo-roadmap-20260903b]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/seo-roadmap-20260903b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/SEO-GEO-AEO-IMPLEMENTATION-ROADMAP-CURRENT.md')
          s = p.read_text()

          old = '''Continue in this order:\n\n1. `M-07`: extend first-party conversion reporting from attributed demo/signup CTA/enterprise-inquiry initiation to confirmed signup and genuinely qualified enterprise lead outcomes.\n2. `T-10`: commit/enforce the intended package-manager lockfile and reproducible clean-install policy if it is still unresolved on `main`.\n3. `T-12`: reproduce/identify the single non-blocking homepage image-alt notice reported by Bing before making any markup change.\n4. `M-05`: establish the fixed answer-engine mention/citation benchmark using the query/prompt set in this file and a reproducible logged methodology.\n5. `T-09` / `M-01`–`M-03`: continue index coverage, query visibility and legacy-host retirement monitoring; the 90-day observation requirement cannot be closed early.\n6. `T-03`: retain the Lighthouse lab baseline and add Search Console/CrUX field monitoring when enough real-user field data becomes available.\n7. `P2-01` / `P2-02` / `E-08`: publish customer proof only after permission and measurable evidence exist.\n8. `P2-08`–`P2-12` / `M-06`: produce original research, integration/partner proof, legitimate third-party authority, referring-domain evidence and transparent community discovery.'''
          new = '''Continue in this order:\n\n1. `T-12`: re-run Bing Live URL inspection and identify the reported homepage missing-alt instance. Current Production-rendered HTML has descriptive `alt` attributes on all three rendered `<img>` elements, so do not change markup without new Bing evidence.\n2. `M-05`: establish the fixed answer-engine mention/citation benchmark using the query/prompt set in this file and a reproducible logged methodology.\n3. `T-09` / `M-01`–`M-03`: continue index coverage, query visibility and legacy-host retirement monitoring; the 90-day observation requirement cannot be closed early.\n4. `T-03`: retain the Lighthouse lab baseline and add Search Console/CrUX field monitoring when enough real-user field data becomes available.\n5. `P2-01` / `P2-02` / `E-08`: publish customer proof only after permission and measurable evidence exist.\n6. `P2-08`–`P2-12` / `M-06`: produce original research, integration/partner proof, legitimate third-party authority, referring-domain evidence and transparent community discovery.'''
          if old not in s:
              raise SystemExit('Current next actions block not found')
          s = s.replace(old, new, 1)

          s = s.replace('Status: `M-04 DONE`; `M-07 PARTIAL`', 'Status: `M-04 DONE`; `M-07 DONE`', 1)
          old_gap = 'Remaining `M-07` acceptance gap: connect attribution to **confirmed signup** and a genuinely **qualified enterprise lead** outcome, not merely CTA/initiation events.'
          new_gap = '''`M-07` completion evidence:\n\n- PR `#231` — `Complete M-07 confirmed conversion attribution`.\n- Production merge commit: `6f1b9dad90f5481a0271645651f0a3b7cdce672e`.\n- Production deployment reached `READY`; canonical `/enterprise` returned HTTP `200` with the new explicit intake form.\n- Confirmed-signup attribution is emitted server-side only after a real authenticated signup outcome, including email confirmation where required.\n- OAuth signup is distinguished from login and established OAuth users are not counted as new signups.\n- Enterprise contact identity is stored separately from identity-free analytics.\n- `qualified_enterprise_lead` is derived server-side only when the submitted intake satisfies the documented Public Beta qualification boundary: non-consumer work email, 50+ employees, deployment horizon within six months, and decision-maker or executive-sponsor responsibility.\n- No synthetic signup or Enterprise lead was created to close this item, and no real conversion volume is claimed until genuine user outcomes occur.'''
          if old_gap not in s:
              raise SystemExit('M-07 gap text not found')
          s = s.replace(old_gap, new_gap, 1)

          s = s.replace('| T-10 | TODO | Lockfile + reproducible clean-install enforcement | Engineering |', '| T-10 | DONE | Canonical npm `package-lock.json` v3 committed; CI uses `npm ci` from clean checkout; PR `#232` | Engineering |', 1)
          s = s.replace('| T-12 | TODO | Reproduce/identify Bing homepage missing-alt notice | Engineering |', '| T-12 | PARTIAL | Current Production HTML does not reproduce the notice: all three rendered `<img>` elements have descriptive `alt`; Bing-specific instance still needs fresh Live URL evidence before any markup change | Engineering |', 1)
          s = s.replace('| M-07 | PARTIAL | Finish confirmed-signup and qualified-enterprise conversion attribution |', '| M-07 | DONE | Confirmed signup and server-qualified Enterprise lead attribution deployed; observe real outcome volume only when genuine users generate it |', 1)

          marker = '## Full Production SEO crawl — completed 2026-09-03'
          insert = '''## Reproducible npm installs — completed 2026-09-03\n\nStatus: `T-10 DONE`\n\nEvidence:\n\n- Baseline `main` had no npm, pnpm or Yarn lockfile while CI used Node 22 with `npm install`.\n- Vercel consequently resolved floating package ranges independently; for example, `next` declared as `^15.4.6` resolved to `15.5.24` before lockfile enforcement.\n- A canonical npm `package-lock.json` with `lockfileVersion: 3` was generated through GitHub Actions using Node 22 and live npm registry resolution rather than being synthesized manually.\n- `.npmrc` declares `package-lock=true`.\n- CI now uses `npm ci` with npm cache enabled from the committed lockfile.\n- PR `#232` — `Enforce reproducible npm installs`.\n- PR CI run `33726076763`: `SUCCESS`; `npm ci`, typecheck, lint, all existing phase/routing/software-company tests and Production build passed from a clean checkout.\n- Production merge commit: `9d265a4984d30f7b8baa3585dd4ae58727a40d9c`.\n\n## Bing missing-alt reproduction — 2026-09-03\n\nStatus: `T-12 PARTIAL`\n\nCurrent canonical homepage HTML was re-fetched after the M-07 Production deployment. The three rendered `<img>` elements are the sidebar, mobile-header and footer RYTHM logos, and all three render `alt="RYTHM Company OS"`. `og:image:alt` is also present. The historical Bing Live URL notice therefore could not be reproduced from current Production HTML. Do not change markup by inference; keep this item open until a fresh Bing Live URL inspection either identifies the exact instance or confirms that the notice has cleared.\n\n'''
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SEO-GEO-AEO-IMPLEMENTATION-ROADMAP-CURRENT.md
          git diff --cached --check
          git commit -m "Update SEO roadmap checkpoint after M-07 and T-10"
          git push origin HEAD:docs/seo-roadmap-20260903b
