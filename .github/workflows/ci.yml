name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:phase0
      - run: npm run test:phase1a
      - run: npm run test:phase1b
      - run: npm run test:phase1c
      - run: npm run test:phase1d
      - run: npm run test:phase2
      - run: npm run test:phase2:direct-guard
      - run: npm run test:phase2:rls
      - run: npm run test:phase3
      - run: npm run test:phase4
      - run: npm run test:phase4:adapters
      - run: npm run test:routing
      - run: npm run test:software-company
      - run: npm run build