name: W02 Live Staging Acceptance (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type W02-STAGING-ONLY to authorize disposable fixture tests'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: w02-live-staging
  cancel-in-progress: false

jobs:
  verify-staging:
    if: ${{ github.event.inputs.confirm_staging_only == 'W02-STAGING-ONLY' && github.ref == 'refs/heads/test/w02-isolated-multitenant-fixtures' }}
    environment: w02-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      W02_STAGING_REF: ${{ vars.W02_STAGING_REF }}
      W02_STAGING_SUPABASE_URL: ${{ vars.W02_STAGING_SUPABASE_URL }}
      W02_STAGING_SERVICE_ROLE_KEY: ${{ secrets.W02_STAGING_SERVICE_ROLE_KEY }}
      W02_STAGING_ANON_KEY: ${{ secrets.W02_STAGING_ANON_KEY }}
      W02_TEST_PASSWORD: ${{ secrets.W02_TEST_PASSWORD }}
      W02_W01_VERIFIED: 'true'
    steps:
      - name: Refuse missing or incorrect staging configuration
        shell: bash
        run: |
          if [[ "$W02_STAGING_REF" != "viqjdgohtxqkrdgwtull" ]]; then echo "::error::Staging project reference does not match"; exit 1; fi
          if [[ "$W02_STAGING_SUPABASE_URL" != "https://viqjdgohtxqkrdgwtull.supabase.co" ]]; then echo "::error::Staging project URL does not match"; exit 1; fi
          if [[ -z "$W02_STAGING_SERVICE_ROLE_KEY" ]]; then echo "::error::Service role key is missing"; exit 1; fi
          if [[ -z "$W02_STAGING_ANON_KEY" ]]; then echo "::error::Anon key is missing"; exit 1; fi
          if [[ "${#W02_TEST_PASSWORD}" -lt 16 ]]; then echo "::error::Test password has fewer than 16 characters"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Offline contract gate
        run: npm run test:w02
      - name: Complete or repair only the synthetic staging fixtures
        run: node scripts/fixtures/w02-staging.mjs setup
      - name: Verify existing isolated fixtures without changing historical audit records
        run: node scripts/fixtures/w02-staging.mjs verify
      - name: Quarantine fixtures without deleting historical audit records
        run: node scripts/fixtures/w02-staging.mjs quarantine
      - name: Verify quarantine repeatability
        run: node scripts/fixtures/w02-staging.mjs verify-quarantine
      - name: Report audit-preserving archival policy
        run: echo "::notice::W02 historic parent rows intentionally remain for audit integrity; acceptance is zero active fixture access, not physical deletion."
